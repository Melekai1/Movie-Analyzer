<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Movie Analyzer</title>
        <link rel="stylesheet" href="/static/distributor.css">
    </head>

<body>

    <section class="header">
            <h1>Movie Analyzer</h1>
            <button onclick="window.location.href='/'">Home</button>
    </section>

    <section class="search-section">
            <h2>Select Distributor</h2>
            <select id="mySelect">
                <option>Universal Pictures</option>
                <option>Paramount Pictures</option>
                <option>Walt Disney Studios Motion Pictures</option>
                <option>Warner Bros.</option>
                <option>Twentienth Century Fox</option>
            </select>
            <button onclick="getMovies()">Go</button>
    </section>
    <br>
       
       

        


</body>


<script>
    let movieList = [];
    const getData = async () => {
        const res = await fetch("/api/all_movies")
        const data = await res.json();
        movieList = data;
    }

    document.addEventListener("DOMContentLoaded", getData);

    function getMovies() {
        const selectedElement = document.getElementById("mySelect");
        const distributorName = selectedElement.value;
        let selectedList = []
        for (let i = 0; i < movieList.length; i++) {
            if (movieList[i].studio == distributorName) {
                selectedList.push(movieList[i]);
            }
        }
        console.log(selectedList);
        let table = document.createElement("table");
        let thead = document.createElement("thead");
        let tbody = document.createElement("tbody");
        table.append(thead, tbody);

        let tableRow1 = document.createElement("tr");
        let title = document.createElement("th");
        let distributor = document.createElement("th");
        title.textContent = "TITLE\n" + selectedList[0]["title"];
        distributor.textContent = "DISTRIBUTOR\n" + distributorName;
        tableRow1.append(title, distributor);
        thead.append(tableRow1);

   

        
        

      
        document.body.append(table);



    }





</script>





</html>
